name: Weekly performance
# Sunday 05:10 UTC = 08:10 EAT, before markets reopen.
on:
  schedule:
    - cron: '10 5 * * 0'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: journal
  cancel-in-progress: false
jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_MENTION: ${{ github.repository_owner }}
        run: python -m exness_intel.run weekly
      - run: |
          git config user.name "exness-intel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports data
          git diff --cached --quiet && exit 0
          git commit -m "weekly review $(date -u +%F)" && git pull --rebase -q && git push -q
